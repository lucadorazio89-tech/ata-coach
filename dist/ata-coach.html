<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATA Coach</title><meta name="theme-color" content="#2C3A92">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>/* ATA Coach — identità: evidenziatore giallo (studio) + timbro blu (segreteria). Un solo carattere ad alta leggibilità. */
:root {
  --paper: #F5F6FA; --surface: #FFFFFF; --ink: #1D2242; --muted: #5A6080; --line: #D8DCEA;
  --stamp: #2C3A92; --stamp-soft: #E5E8F6; --mark: #FFE45E; --mark-ink: #1D2242;
  --ok: #1F6B4A; --ok-soft: #E3F2EA; --ko: #A3261D; --ko-soft: #FBE9E7;
  --r-big: 20px; --r: 12px; --r-s: 8px;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #11142A; --surface: #191D38; --ink: #E8EAF6; --muted: #A3A8C8; --line: #2D3259; --stamp: #9AA6FF; --stamp-soft: #252B52; --mark: #EED34C; --ok: #74D3A2; --ok-soft: #173327; --ko: #FF8F84; --ko-soft: #3A1B1B; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #11142A; --surface: #191D38; --ink: #E8EAF6; --muted: #A3A8C8; --line: #2D3259; --stamp: #9AA6FF; --stamp-soft: #252B52; --mark: #EED34C; --ok: #74D3A2; --ok-soft: #173327; --ko: #FF8F84; --ko-soft: #3A1B1B; color-scheme: dark; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1.125rem/1.55 "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif; }
.wrap { max-width: 38rem; margin: 0 auto; padding: 1.25rem 1.25rem 3rem; }
h1 { font-size: 1.9rem; line-height: 1.2; margin: .4rem 0 .8rem; letter-spacing: -.01em; }
h2 { font-size: 1.3rem; line-height: 1.3; margin: 1.8rem 0 .6rem; }
h3 { font-size: 1.1rem; margin: 1.2rem 0 .4rem; }
p { margin: .5rem 0; max-width: 34em; }
a { color: var(--stamp); }
.lead { font-size: 1.2rem; color: var(--ink); }
.muted { color: var(--muted); } .small { font-size: .92rem; }
mark { background: linear-gradient(transparent 12%, var(--mark) 12%, var(--mark) 88%, transparent 88%); color: var(--mark-ink); padding: 0 .12em; border-radius: 2px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--stamp); outline-offset: 2px; }
.brand { font-weight: 700; color: var(--stamp); margin: 0; font-size: 1rem; }

/* bottoni */
.btn { display: inline-block; border: 2px solid var(--line); background: var(--surface); border-radius: var(--r); padding: .75rem 1.1rem; margin: .35rem .35rem .35rem 0; font-weight: 700; }
.btn.primary { background: var(--stamp); border-color: var(--stamp); color: var(--surface); }
.link { background: none; border: none; padding: .5rem 0; color: var(--stamp); text-decoration: underline; text-underline-offset: 3px; }
.link.danger { color: var(--ko); }
.back { text-decoration: none; margin-bottom: .2rem; }
.icon { background: var(--surface); border: 2px solid var(--line); border-radius: 50%; width: 2.8rem; height: 2.8rem; font-size: 1.3rem; }
.chip { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: .45rem .9rem; font-weight: 700; }
.chip.on, .choice.on { border-color: var(--stamp); background: var(--stamp-soft); color: var(--stamp); }
.chip.small { font-size: .9rem; padding: .3rem .7rem; font-weight: 400; }
.chips { display: flex; flex-wrap: wrap; gap: .45rem; margin: .5rem 0; }

/* home */
.top { display: flex; justify-content: space-between; align-items: flex-start; }
.fai-tu { display: block; width: 100%; text-align: left; margin: 1.2rem 0 1rem; padding: 1.4rem 1.5rem 1.5rem; border: 0; border-radius: var(--r-big); background: var(--mark); color: var(--mark-ink); box-shadow: 0 3px 0 rgba(29,34,66,.22); }
.fai-tu:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(29,34,66,.22); }
.ft-label { display: block; font-size: 3rem; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
.ft-sub { display: block; margin-top: .45rem; font-size: 1.05rem; }
.time-k { color: var(--muted); margin: .2rem 0 .3rem; }
.time-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: .4rem; margin: 0 0 .8rem; }
.time-row .chip { padding: .55rem 0; }
.btn.lazy { width: 100%; text-align: left; font-weight: 400; }
.btn.continue { width: 100%; text-align: left; border-color: var(--stamp); color: var(--stamp); margin-top: 1rem; }
.btn.continue small { display: block; font-weight: 400; color: var(--muted); }
.done-today { color: var(--ok); font-weight: 700; }
details.today { margin: 1rem 0; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); padding: .6rem 0; }
details summary { cursor: pointer; font-weight: 700; padding: .3rem 0; }
.notice { background: var(--stamp-soft); border-radius: var(--r); padding: .8rem 1rem; }
.notices { display: grid; gap: .5rem; margin: 1rem 0; }
.notice-item { text-align: left; border: 0; border-left: 5px solid var(--stamp); background: var(--surface); padding: .7rem .9rem; border-radius: 0 var(--r-s) var(--r-s) 0; font-size: 1rem; }
.notice-item.urgent { border-left-color: var(--ko); }
.more { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin: 1.4rem 0; }
.more button { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: .9rem; font-weight: 700; min-height: 4.2rem; }
.more b { display: inline-block; min-width: 1.6em; text-align: center; background: var(--ko); color: var(--surface); border-radius: 999px; font-size: .85rem; margin-left: .2rem; }

/* timbro */
.stamp { display: block; margin: 1.6rem .3rem 0; padding: .9rem 1rem; border: 3px solid var(--stamp); outline: 1.5px solid var(--stamp); outline-offset: 3px; border-radius: 6px; color: var(--stamp); transform: rotate(-1.1deg); }
.stamp-k { display: block; font-size: .85rem; opacity: .85; }
.stamp-v { display: block; font-weight: 700; font-size: 1.08rem; line-height: 1.35; }
.stamp.big .stamp-v { font-size: 1.2rem; }

/* sessione */
.run-head { display: flex; justify-content: space-between; align-items: center; }
.run-count { color: var(--muted); font-size: .95rem; }
.progress { height: 6px; background: var(--line); border-radius: 3px; margin: .3rem 0 1.4rem; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--stamp); transition: width .25s; }
.crumb { color: var(--muted); font-size: .95rem; margin: 0; }
.qtext { font-size: 1.35rem; margin-top: .4rem; }
.opts { display: grid; gap: .55rem; margin: 1rem 0; }
.opt { display: flex; gap: .8rem; align-items: flex-start; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: .85rem 1rem; }
.opt:not(:disabled):hover { border-color: var(--stamp); }
.opt:disabled { cursor: default; opacity: .75; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); opacity: 1; }
.opt.wrong { border-color: var(--ko); background: var(--ko-soft); opacity: 1; }
.opt-k { flex: none; width: 1.8rem; height: 1.8rem; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-size: .85rem; font-weight: 700; color: var(--muted); }
.pre { display: flex; gap: 1rem; align-items: center; }
.feedback { margin-top: 1rem; padding: 1rem 1.1rem; border-radius: var(--r); background: var(--surface); border-left: 6px solid var(--line); }
.feedback.ok { border-left-color: var(--ok); } .feedback.ko { border-left-color: var(--ko); }
.verdict { font-weight: 700; font-size: 1.15rem; margin-top: 0; }
.why { margin: .8rem 0; } .why-q { font-weight: 700; margin-bottom: .2rem; }
.help { background: var(--stamp-soft); border-radius: var(--r); padding: .8rem 1rem; margin: .8rem 0; }
.ai-text { border-left: 3px solid var(--stamp); padding-left: .7rem; }
.source { font-size: .92rem; color: var(--muted); }
.verify { color: var(--ko); font-size: .82rem; border: 1.5px solid var(--ko); border-radius: 4px; padding: 0 .3rem; white-space: nowrap; }
.verify-box { border: 2px dashed var(--ko); color: var(--ink); border-radius: var(--r-s); padding: .6rem .8rem; }

/* lezione */
.lesson p { line-height: 1.65; }
.example { background: var(--surface); border-radius: var(--r); padding: .8rem 1rem; margin: 1rem 0; border: 2px solid var(--line); }
.ex-k { font-weight: 700; color: var(--stamp); margin: 0 0 .2rem; }
.keys li { margin: .25rem 0; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem; margin-top: 1rem; }

/* form */
.field { display: block; margin: .9rem 0; font-weight: 700; }
.field input, .field select, .field textarea, textarea { display: block; width: 100%; margin-top: .35rem; font: inherit; font-weight: 400; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-s); padding: .65rem .75rem; }
.field.inline { font-weight: 400; font-size: .95rem; }
.check { display: flex; gap: .6rem; align-items: flex-start; margin: .6rem 0; }
.check input { width: 1.3rem; height: 1.3rem; margin-top: .2rem; flex: none; accent-color: var(--stamp); }
.choices { display: grid; gap: .5rem; margin: .8rem 0 1.2rem; }
.choices.row { grid-auto-flow: column; grid-auto-columns: 1fr; }
.choice { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: var(--r); padding: .9rem 1rem; font-weight: 700; }
.ob-head { display: flex; justify-content: space-between; color: var(--muted); }
.ob-head .step { margin: 0; font-size: .95rem; }
.avail { display: grid; grid-template-columns: repeat(7, 1fr); gap: .3rem; }
.avail label { display: grid; gap: .2rem; text-align: center; font-size: .85rem; }
.avail input { width: 100%; font: inherit; text-align: center; padding: .45rem .1rem; border: 2px solid var(--line); border-radius: var(--r-s); background: var(--surface); color: var(--ink); }
.settings section { border-top: 2px solid var(--line); margin-top: 1.4rem; }

/* menu e liste */
.menu { display: grid; gap: .5rem; margin: 1rem 0; }
.menu button { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: .9rem 1rem; display: grid; gap: .15rem; }
.menu button span { color: var(--muted); font-size: .95rem; }
.menu.compact button { padding: .7rem 1rem; display: block; }
.menu small { color: var(--muted); }
.pill { display: inline-block; border-radius: 999px; padding: .05rem .6rem; font-size: .88rem; font-weight: 700; background: var(--stamp-soft); color: var(--stamp); }
.pill-non-pronto { background: var(--ko-soft); color: var(--ko); }
.pill-pronto { background: var(--ok-soft); color: var(--ok); }
.deadline { border-left: 4px solid var(--line); padding-left: .8rem; margin: .8rem 0; }

/* report */
.verbale { margin: 1.2rem 0; border-top: 2px solid var(--ink); }
.verbale div { display: grid; grid-template-columns: 8.5rem 1fr; gap: .8rem; padding: .6rem 0; border-bottom: 1px solid var(--line); }
.verbale dt { font-weight: 700; } .verbale dd { margin: 0; }
.simrow { border-bottom: 1px solid var(--line); padding: .5rem 0; }

/* progressi */
.bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--stamp); }
.topic-row { margin: .8rem 0; } .tr-head { display: flex; justify-content: space-between; gap: 1rem; font-weight: 700; font-size: 1rem; }
.topic-row p { margin: .2rem 0 0; }
.warn { border: 2px solid var(--ko); border-radius: var(--r); padding: .2rem 1rem .6rem; margin: 1rem 0; }
.warn h2 { margin-top: .6rem; font-size: 1.1rem; color: var(--ko); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: .4rem; height: 7rem; align-items: end; margin: .8rem 0; }
.week .day { display: grid; grid-template-rows: 1fr auto; height: 100%; align-items: end; text-align: center; }
.week .col { display: block; background: var(--stamp); border-radius: 4px 4px 0 0; min-height: 2px; }
.week small { color: var(--muted); font-size: .8rem; }
.cal { list-style: none; padding: 0; margin: 1rem 0; }
.cal li { display: grid; grid-template-columns: 4.5rem 1fr; gap: .6rem; padding: .55rem 0; border-bottom: 1px solid var(--line); }
.cal li.rest { color: var(--muted); }
.cal-d { font-weight: 700; }

.toast { position: fixed; left: 50%; bottom: calc(1.2rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: .7rem 1.1rem; border-radius: var(--r); max-width: 90vw; z-index: 10; }
@media (max-width: 380px) { .ft-label { font-size: 2.5rem; } .more { grid-template-columns: 1fr; } .verbale div { grid-template-columns: 1fr; gap: .1rem; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.news, .sources { list-style: none; padding: 0; }
.news li, .sources li { padding: .65rem 0; border-bottom: 1px solid var(--line); }
.pushbox { border: 2px solid var(--stamp); border-radius: var(--r); padding: .2rem 1rem .8rem; margin: .8rem 0; }
.pushbox textarea { font-size: .8rem; font-family: ui-monospace, monospace; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link.small { display: block; font-size: .9rem; margin-top: .4rem; }

.sync-line { color: var(--muted); font-size: .88rem; text-align: center; margin-top: 1.4rem; max-width: none; }
</style></head>

<script>window.__SINGLE_FILE__ = true;</script>
<script>(function(){'use strict';
// ===== core/util.js =====
// Utility condivise. Nessuna dipendenza esterna.
const DAY = 86400000;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const uid = (p = 'id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function startOfDay(d = Date.now()) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x.getTime(); }
function dayKey(d = Date.now()) {
  const x = new Date(d);
  return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
}
function daysBetween(a, b) { return Math.round((startOfDay(b) - startOfDay(a)) / DAY); }
function addDays(d, n) { return startOfDay(d) + n * DAY; }

const WEEKDAYS = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
const MONTHS = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
function fmtDate(d) { const x = new Date(d); return x.getDate() + ' ' + MONTHS[x.getMonth()] + ' ' + x.getFullYear(); }
function fmtShort(d) { const x = new Date(d); return WEEKDAYS[x.getDay()].slice(0, 3) + ' ' + x.getDate(); }
function fmtMinutes(m) { m = Math.round(m); if (m < 60) return m + ' min'; const h = Math.floor(m / 60), r = m % 60; return h + ' h' + (r ? ' ' + r + ' min' : ''); }

function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }

function seededRandom(seed = 1) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 1000000) / 1000000; }; }
function shuffle(arr, rnd = Math.random) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function normalizeText(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim(); }
function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const sum = a => a.reduce((x, y) => x + y, 0);
const avg = a => a.length ? sum(a) / a.length : 0;

// ===== core/store.js =====
// Database locale. Lo stato utente (progressi) è separato dai contenuti didattici (content pack in seed.js).
// Adapter: IndexedDB (browser), localStorage (fallback), memoria (test).

const SCHEMA_VERSION = 3;

function emptyState() {
  return {
    schemaVersion: SCHEMA_VERSION,
    createdAt: Date.now(),
    user: null,                 // { name, goal, availability:[min dom..sab], notifyHour, startedAt, hasCIAD, hasDiploma }
    procedures: [],             // bandi/procedure seguite dall'utente (copie modificabili dei template + importati)
    topicStats: {},             // topicId -> statistiche del motore didattico
    cards: {},                  // questionId -> stato spaced repetition
    attempts: [],               // ogni risposta data
    errors: [],                 // registro errori con causa
    sessions: [],               // sessioni di studio con report
    lessonsRead: {},            // lessonId -> timestamp
    history: {},                // dayKey -> { mastery, coverage } per previsioni
    plans: {},                  // dayKey -> piano del giorno (DailyPlan)
    lastBackupAt: null,
    sourceChecks: {},           // sourceId -> data dell'ultima verifica fatta da una persona
    reports: [],                // segnalazioni di errori nei contenuti
    feedSeen: null,             // ultima novità dalle fonti già vista
    nextPlan: null,             // { day, line } usato dal service worker per il promemoria push
    lessonLog: [],              // { id, lessonId, ok, at } eventi lezione (per ricostruire i progressi)
    tombstones: {},             // id eliminati -> data (per propagare le cancellazioni tra dispositivi)
    sync: { repo: '', token: '', lastSyncAt: null, lastError: null, deviceId: null },
    customQuestions: [],        // domande importate o generate (sempre marcate con origine)
    documents: [],              // testi importati (bandi, appunti)
    notifications: [],          // { id, at, text, read }
    aiLog: [],                  // { at, task, tokensIn, tokensOut, cached, provider }
    aiCache: {},                // hash -> { at, output }
    settings: { aiMode: 'off', provider: 'gemini', model: 'gemini-flash-latest', apiKey: '', dailyTokenBudget: 20000, notifications: false },
    current: null               // sessione in corso (per "continua da dove ero")
  };
}

const MIGRATIONS = {
  // v2: il modello gemini-2.5-flash viene spento il 16/10/2026 → alias sempre aggiornato
  2: s => { if (!s.settings.model || /^gemini-(2\.0|2\.5)-flash$/.test(s.settings.model)) s.settings.model = 'gemini-flash-latest'; return s; },
  // v3: sincronizzazione — registro lezioni, test iniziale marcato sulle risposte, cancellazioni tracciate
  3: s => {
    if (!s.lessonLog || !s.lessonLog.length) s.lessonLog = Object.entries(s.lessonsRead || {}).map(([lessonId, at]) => ({ id: 'l_mig_' + lessonId, lessonId, ok: true, at }));
    const diag = new Set((s.sessions || []).filter(x => x.diagnostic).map(x => x.id));
    for (const a of s.attempts || []) if (a.session && diag.has(a.session)) a.diag = true;
    return s;
  }
};

function migrate(state) {
  const base = emptyState();
  let s = { ...base, ...state, settings: { ...base.settings, ...(state.settings || {}) }, sync: { ...base.sync, ...(state.sync || {}) } };
  let v = s.schemaVersion || 1;
  while (v < SCHEMA_VERSION) { v++; if (MIGRATIONS[v]) s = MIGRATIONS[v](s); s.schemaVersion = v; }
  return s;
}

class MemoryAdapter {
  constructor() { this.data = {}; }
  async get(k) { return this.data[k] ? JSON.parse(this.data[k]) : null; }
  async set(k, v) { this.data[k] = JSON.stringify(v); }
  async keys() { return Object.keys(this.data); }
  async del(k) { delete this.data[k]; }
}

class LocalStorageAdapter {
  constructor(prefix = 'atacoach:') { this.p = prefix; }
  async get(k) { try { const v = localStorage.getItem(this.p + k); return v ? JSON.parse(v) : null; } catch { return null; } }
  async set(k, v) { localStorage.setItem(this.p + k, JSON.stringify(v)); }
  async keys() { const out = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(this.p)) out.push(k.slice(this.p.length)); } return out; }
  async del(k) { localStorage.removeItem(this.p + k); }
}

class IndexedDBAdapter {
  constructor(name = 'ata-coach') { this.name = name; this.dbp = null; }
  db() {
    if (!this.dbp) this.dbp = new Promise((res, rej) => {
      const r = indexedDB.open(this.name, 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this.dbp;
  }
  async tx(mode, fn) { const db = await this.db(); return new Promise((res, rej) => { const t = db.transaction('kv', mode); const st = t.objectStore('kv'); const out = fn(st); t.oncomplete = () => res(out.result); t.onerror = () => rej(t.error); }); }
  async get(k) { const v = await this.tx('readonly', s => s.get(k)); return v ?? null; }
  async set(k, v) { await this.tx('readwrite', s => s.put(v, k)); }
  async keys() { return (await this.tx('readonly', s => s.getAllKeys())) || []; }
  async del(k) { await this.tx('readwrite', s => s.delete(k)); }
}

async function pickAdapter() {
  try { if (typeof indexedDB !== 'undefined') { const a = new IndexedDBAdapter(); await a.keys(); return a; } } catch { /* fallback */ }
  try { if (typeof localStorage !== 'undefined') { localStorage.setItem('atacoach:test', '1'); localStorage.removeItem('atacoach:test'); return new LocalStorageAdapter(); } } catch { /* fallback */ }
  return new MemoryAdapter();
}

class Store {
  constructor(adapter) { this.adapter = adapter; this.state = emptyState(); this.listeners = []; this._t = null; }
  async load() { const s = await this.adapter.get('state'); this.state = s ? migrate(s) : emptyState(); return this.state; }
  async save() { await this.adapter.set('state', this.state); await this.snapshot(); }
  saveSoon() { clearTimeout(this._t); this._t = setTimeout(() => this.save().catch(e => console.error('Salvataggio fallito', e)), 300); }
  mutate(fn) { fn(this.state); this.saveSoon(); this.listeners.forEach(l => l(this.state)); }
  onChange(l) { this.listeners.push(l); }
  // Backup automatico: una copia al giorno, tiene le ultime 7.
  async snapshot() {
    const key = 'snap:' + dayKey();
    const keys = (await this.adapter.keys()).filter(k => String(k).startsWith('snap:')).sort();
    if (!keys.includes(key)) { await this.adapter.set(key, this.state); keys.push(key); }
    while (keys.length > 7) await this.adapter.del(keys.shift());
  }
  async listSnapshots() { return (await this.adapter.keys()).filter(k => String(k).startsWith('snap:')).sort().reverse(); }
  async restoreSnapshot(key) { const s = await this.adapter.get(key); if (s) { this.state = migrate(s); await this.adapter.set('state', this.state); } return !!s; }
  exportJSON() { const copy = { ...this.state, settings: { ...this.state.settings, apiKey: '', vapid: null }, sync: { repo: '', token: '', lastSyncAt: null, lastError: null, deviceId: null } }; return JSON.stringify({ app: 'ata-coach', exportedAt: new Date().toISOString(), data: copy }, null, 1); }
  async importJSON(text) {
    const parsed = JSON.parse(text);
    if (!parsed || parsed.app !== 'ata-coach' || !parsed.data) throw new Error('Il file non è un backup di ATA Coach.');
    const key = this.state.settings.apiKey, vapid = this.state.settings.vapid, sync = this.state.sync;
    this.state = migrate(parsed.data);
    this.state.sync = sync;
    if (!this.state.settings.apiKey) this.state.settings.apiKey = key;
    if (!this.state.settings.vapid) this.state.settings.vapid = vapid;
    await this.save();
    return this.state;
  }
}

  { id: 'l_contab', topic: 't_contab', minutes: 5, sources: ['di129'],
    body: 'La contabilità della scuola segue il ==D.I. 129/2018==. L\'esercizio finanziario coincide con l\'==anno solare== (1 gennaio – 31 dicembre), non con l\'anno scolastico.\n\nIl ==Programma annuale== è il bilancio di previsione: lo predispone il dirigente con la collaborazione del DSGA e lo ==approva il consiglio d\'istituto==. Il ==conto consuntivo== racconta com\'è andata: lo ==predispone il DSGA== e lo approva il consiglio d\'istituto, dopo il parere dei revisori.\n\nLe piccole spese urgenti passano dal ==fondo economale==, gestito dal DSGA.',
    example: 'Serve comprare subito un toner da pochi euro: si usa il fondo economale per le minute spese.',
    keyPoints: ['D.I. 129/2018', 'Esercizio = anno solare', 'Programma annuale: approva il consiglio d\'istituto', 'Consuntivo: predispone il DSGA'],
    simple: 'Il programma annuale è il "preventivo" della scuola, il consuntivo è il "resoconto". I conti vanno da gennaio a dicembre.' },
  { id: 'l_lavoro', topic: 't_lavoro', minutes: 4, sources: ['dlgs165', 'dpr62'],
    body: 'Il lavoro nelle PA è regolato dal ==D.Lgs. 165/2001== e dai contratti collettivi (per la scuola, il CCNL Istruzione e Ricerca).\n\nIl ==codice di comportamento== dei dipendenti pubblici è il ==D.P.R. 62/2013==: imparzialità, riservatezza, cortesia con il pubblico. Sui ==regali==: sono ammessi solo quelli d\'uso di ==modico valore==; un regalo costoso da un fornitore va rifiutato.',
    example: 'Un fornitore lascia in segreteria un buono da 200 euro "per il disturbo": va rifiutato e, se serve, segnalato.',
    keyPoints: ['D.Lgs. 165/2001', 'Codice di comportamento: D.P.R. 62/2013', 'Regali: solo di modico valore'],
    simple: 'Chi lavora per la PA lavora per tutti: niente favori, niente regali importanti, gentilezza con chiunque.' },
  { id: 'l_grad', topic: 't_grad', minutes: 5, sources: ['dm89', 'news_ciad'],
    body: 'Per le supplenze ATA esistono tre fasce, usate ==in ordine: prima, seconda, terza==. La ==prima fascia== ("24 mesi") richiede almeno 24 mesi di servizio nel profilo nelle scuole statali.\n\nChi parte da zero entra nella ==terza fascia== (graduatorie di istituto). Si forma ==per soli titoli==: niente prove d\'esame. La domanda si fa online su ==Istanze Online== con SPID o CIE e si rinnova ogni tre anni.\n\nPer il triennio 2024–2027 il D.M. 89/2024 ha chiesto all\'assistente amministrativo il ==diploma più la CIAD== (certificazione di alfabetizzazione digitale). Chi non l\'ha presentata in tempo è stato escluso. Le regole del prossimo bando vanno verificate quando esce.',
    example: 'Nella terza fascia il punteggio dipende dai titoli e dal servizio, non da quanto studi: lo studio serve per la CIAD e per lavorare bene quando ti chiamano.',
    keyPoints: ['Ordine: I, II, III fascia', 'III fascia: soli titoli, nessuna prova', 'Domanda su Istanze Online (SPID/CIE)', 'AA 2024–27: diploma + CIAD (da verificare per il 2027)'],
    simple: 'Per iniziare conta "cosa hai in mano" (titoli), non un esame. Ma senza la certificazione informatica non entri.' },
  { id: 'l_sic', topic: 't_sic', minutes: 4, sources: ['dlgs81'],
    body: 'La sicurezza sul lavoro è regolata dal ==D.Lgs. 81/2008== (testo unico). A scuola il ==datore di lavoro== è il ==dirigente scolastico==.\n\nAlcuni obblighi ==non sono delegabili==: la ==valutazione dei rischi con il DVR== (documento di valutazione dei rischi) e la nomina dell\'==RSPP==. I lavoratori eleggono o designano l\'==RLS==, il rappresentante dei lavoratori per la sicurezza.',
    example: 'Noti un cavo scoperto vicino alla fotocopiatrice: lo segnali subito, secondo le procedure interne.',
    keyPoints: ['D.Lgs. 81/2008', 'Datore di lavoro: dirigente', 'Non delegabili: DVR e nomina RSPP', 'RLS = rappresentante dei lavoratori'],
    simple: 'Il dirigente risponde della sicurezza. Il DVR è la "mappa dei pericoli" della scuola.' },
  { id: 'l_office', topic: 't_office', minutes: 5, sources: [],
    body: 'In segreteria lavori ogni giorno con file. Riconosci le ==estensioni==: .docx (testo), ==.xlsx (foglio di calcolo)==, .pptx (presentazione), ==.pdf== (documento che si vede uguale ovunque e si modifica difficilmente).\n\nNel foglio di calcolo in italiano: ==SOMMA(A1:A10)== somma un intervallo, CONTA.NUMERI conta le celle con numeri, MEDIA calcola la media. I ==due punti== indicano un intervallo.\n\nPer trovare qualcosa in un file lungo: ==Ctrl+F== (cerca) oppure i ==filtri== sulle colonne.',
    example: 'Devi mandare una circolare che nessuno deve modificare: la esporti in PDF.',
    keyPoints: ['.xlsx = foglio di calcolo', 'PDF per documenti definitivi', '=SOMMA(A1:A10)', 'Ctrl+F e filtri per cercare'],
    simple: 'Word scrive, Excel calcola, il PDF "congela" il documento. Ctrl+F è la lente d\'ingrandimento.' },
  { id: 'l_web', topic: 't_web', minutes: 5, sources: [],
    body: 'La ==posta== è lo strumento più usato e più attaccato. Il ==phishing== è una mail falsa che ti spinge a cliccare un link o dare la password, spesso con urgenza ("entro un\'ora").\n\nPer scrivere a molte persone senza mostrare gli indirizzi usa ==Ccn== (copia conoscenza nascosta), non Cc. Il ==lucchetto/HTTPS== indica che la connessione è ==cifrata==, non che il sito sia onesto.\n\nUna ==password sicura== è lunga, diversa per ogni servizio e non contiene dati personali. Se puoi, attiva la verifica in due passaggi.',
    example: 'Arriva una mail "dal Ministero" che chiede di reinserire le credenziali: non clicchi, avvisi il DSGA.',
    keyPoints: ['Phishing: urgenza + link + credenziali', 'Ccn per nascondere gli indirizzi', 'HTTPS = cifrato, non = affidabile', 'Password lunghe e uniche'],
    simple: 'Se una mail ti mette fretta e chiede la password, è quasi sempre una trappola.' },
  { id: 'l_hw', topic: 't_hw', minutes: 4, sources: ['digcomp'],
    body: 'Il ==sistema operativo== (Windows, macOS, Linux) è il programma che fa funzionare il computer e gli altri programmi. I file stanno dentro ==cartelle==, che possono contenere altre cartelle: il ==percorso== (es. Documenti > Segreteria > 2026) dice dove si trova un file.\n\nLa ==RAM== è la memoria di lavoro: si svuota quando spegni. Il ==disco== conserva i file. 1 GB vale circa ==1000 MB==.\n\nCopiare (==Ctrl+C==) lascia l\'originale; tagliare (==Ctrl+X==) e incollare (Ctrl+V) lo ==sposta==. Un file ==.zip== è un archivio compresso che contiene altri file.',
    example: 'Il DSGA ti chiede di spostare i verbali 2025 nella cartella Archivio: usi Taglia e Incolla, così non restano doppioni.',
    keyPoints: ['Sistema operativo = gestisce il computer', 'RAM temporanea, disco permanente', 'Copia lascia l\'originale, Taglia lo sposta', '.zip = archivio compresso'],
    simple: 'Il computer è un armadio: le cartelle sono i cassetti, i file sono i fogli. Il percorso è l\'indirizzo del foglio.' },
  { id: 'l_ricerca', topic: 't_ricerca', minutes: 4, sources: ['digcomp'],
    body: 'Cercare bene fa risparmiare tempo. Le ==virgolette== cercano una frase esatta ("terza fascia ATA"). L\'operatore ==site:== limita la ricerca a un sito (site:mim.gov.it graduatorie).\n\nI risultati ==sponsorizzati== sono pubblicità. Per bandi e scadenze la fonte affidabile è quella ==istituzionale==: sito del Ministero, dell\'Ufficio scolastico regionale, Gazzetta Ufficiale. Gruppi social e blog possono sbagliare o essere vecchi.\n\nPer verificare una notizia: cerca la ==fonte originale==, guarda la ==data==, confronta più fonti.',
    example: 'Su un gruppo leggi "domande ATA entro venerdì": prima di agitarti cerchi la notizia sul sito del Ministero.',
    keyPoints: ['"virgolette" = frase esatta', 'site: = un solo sito', 'Sponsorizzato = pubblicità', 'Fonte originale + data + confronto'],
    simple: 'Su internet chiunque può scrivere. Per le cose importanti credi solo al sito ufficiale.' },
  { id: 'l_cloud', topic: 't_cloud', minutes: 4, sources: ['digcomp'],
    body: 'Il ==cloud== è spazio e programmi su server raggiungibili via internet (es. un drive online). Permette di lavorare in più persone sullo ==stesso documento==, con la ==cronologia delle versioni== per tornare indietro.\n\nQuando condividi scegli il ==permesso==: visualizzatore (solo lettura), commentatore o editor. Un link aperto a ==chiunque abbia il link== è rischioso per documenti con dati personali.\n\nLa ==netiquette== è l\'educazione online: niente maiuscolo continuo (sembra urlare), oggetto chiaro, rispondi a tutti solo se serve. In videochiamata, prima di condividere lo schermo chiudi le finestre riservate.',
    example: 'Devi far vedere a una collega un modulo senza che lo modifichi: lo condividi con permesso di sola visualizzazione.',
    keyPoints: ['Cloud = file e programmi online', 'Permessi: visualizzatore, commentatore, editor', 'Mai link pubblici con dati personali', 'Netiquette: niente MAIUSCOLO'],
    simple: 'Il cloud è una cartella che vive su internet: decidi tu chi può guardare e chi può scrivere.' },
  { id: 'l_contenuti', topic: 't_contenuti', minutes: 4, sources: ['l633', 'digcomp'],
    body: 'Testi e immagini trovati online sono ==protetti dal diritto d\'autore== (L. 633/1941) se non è indicato diversamente. Le licenze ==Creative Commons== dicono cosa puoi fare: BY = devi ==citare l\'autore==; NC = non commerciale; ND = senza modifiche.\n\nUn documento ==accessibile== usa gli ==stili per i titoli== e il ==testo alternativo== nelle immagini, così funziona anche con i lettori di schermo. Il ==PDF/A== è il PDF pensato per la ==conservazione a lungo termine==.\n\nLa ==stampa unione== crea tante lettere personalizzate partendo da un elenco (es. un avviso con il nome di ogni genitore).',
    example: 'Prepari un avviso per il sito: usi un\'immagine con licenza CC BY e scrivi il nome dell\'autore.',
    keyPoints: ['Online non vuol dire libero', 'CC BY = cita l\'autore', 'Stili e testo alternativo = accessibile', 'PDF/A = conservazione', 'Stampa unione = lettere personalizzate'],
    simple: 'Prima di usare un\'immagine trovata online, controlla se puoi. Se la licenza dice BY, scrivi chi l\'ha fatta.' },
  { id: 'l_sicdig', topic: 't_sicdig', minutes: 5, sources: ['digcomp'],
    body: 'Il ==malware== è software dannoso. Il ==ransomware== cifra i file e chiede un riscatto: per questo i ==backup== sono vitali. La regola ==3-2-1==: tre copie, su due supporti diversi, una fuori sede.\n\nInstalla gli ==aggiornamenti==: chiudono falle di sicurezza. Non inserire ==chiavette USB sconosciute==. Quando ti allontani ==blocca lo schermo== (Windows+L). Sul ==Wi-Fi pubblico== evita operazioni sensibili.\n\nSe il computer si comporta in modo strano dopo una mail sospetta: ==scollegalo dalla rete== e avvisa subito il referente.',
    example: 'Vai a prendere un caffè: premi Windows+L, così nessuno vede i dati degli alunni sul tuo schermo.',
    keyPoints: ['Ransomware = file cifrati + riscatto', 'Backup 3-2-1', 'Aggiorna sempre', 'Blocca lo schermo (Win+L)', 'Sospetto? Scollega e avvisa'],
    simple: 'Proteggi il computer come la porta di casa: chiudi a chiave quando esci e tieni una copia delle chiavi altrove.' },
  { id: 'l_problemi', topic: 't_problemi', minutes: 4, sources: ['digcomp'],
    body: 'Molti problemi si risolvono con calma e ordine. Programma bloccato: aspetta, poi chiudilo dal ==Gestione attività== (Ctrl+Alt+Canc). Stampante muta: controlla ==accensione, cavo/rete, carta, coda di stampa==.\n\nPrima di chiamare l\'assistenza ==annota il messaggio di errore== o fai uno ==screenshot== (su Windows: Windows+Maiusc+S). Disco pieno: svuota il cestino, elimina file inutili, archivia quelli vecchi.\n\nSpesso basta ==riavviare==: chiude processi bloccati e applica aggiornamenti.',
    example: 'Il programma del protocollo dà errore: fai uno screenshot del messaggio e lo mandi al tecnico con l\'ora in cui è successo.',
    keyPoints: ['Ctrl+Alt+Canc → Gestione attività', 'Stampante: accesa, collegata, carta, coda', 'Screenshot: Win+Maiusc+S', 'Riavviare risolve spesso'],
    simple: 'Prima di andare nel panico: guarda il messaggio, fai una foto allo schermo, prova a riavviare.' },
  { id: 'l_atti', topic: 't_atti', minutes: 5, sources: ['l241', 'cpa', 'dpr1199'],
    body: 'Ogni ==provvedimento== deve essere ==motivato== (L. 241/1990, art. 3): deve spiegare perché si decide così.\n\nUn atto è ==annullabile== se ha uno di tre vizi (art. 21-octies): ==violazione di legge, eccesso di potere, incompetenza==. È ==nullo== (art. 21-septies) se manca di elementi essenziali o in pochi altri casi gravi.\n\nLa PA può correggersi: con la ==revoca== ritira un atto per ==nuovi motivi di interesse pubblico==; con l\'==annullamento d\'ufficio== elimina un atto ==illegittimo==, entro un termine ragionevole (per autorizzazioni e vantaggi economici non oltre ==12 mesi==).\n\nChi è leso può fare ricorso al ==TAR entro 60 giorni== o ricorso straordinario al ==Presidente della Repubblica entro 120 giorni==.',
    example: 'Un candidato escluso da una graduatoria d\'istituto vuole sapere i tempi per un ricorso al TAR: 60 giorni dalla conoscenza dell\'atto.',
    keyPoints: ['Provvedimenti sempre motivati', 'Annullabile: legge, eccesso di potere, incompetenza', 'Revoca = interesse pubblico; annullamento = illegittimità', 'TAR 60 giorni, Capo dello Stato 120'],
    simple: 'Se la scuola decide, deve spiegare perché. Se ha sbagliato può correggersi; chi è danneggiato ha 60 giorni per il TAR.' },
  { id: 'l_archivio', topic: 't_archivio', minutes: 4, sources: ['dpr445', 'dlgs42', 'cad'],
    body: 'Dopo il protocollo, ogni documento va ==classificato== secondo il ==titolario== (lo schema delle materie) e inserito nel ==fascicolo==, che raccoglie tutti i documenti di uno stesso affare o procedimento.\n\nL\'archivio ha tre fasi: ==corrente== (pratiche in corso), ==di deposito== (pratiche chiuse ancora utili), ==storico== (documenti da conservare per sempre; vi passano gli affari esauriti da oltre ==40 anni==).\n\nNelle PA i documenti ==non si buttano== a piacere: lo ==scarto== richiede l\'==autorizzazione della Soprintendenza archivistica==. Per i documenti digitali c\'è la ==conservazione==, che ne garantisce nel tempo integrità, autenticità e leggibilità.',
    example: 'Una collega vuole liberare un armadio buttando i registri degli anni \'90: prima serve la procedura di scarto autorizzata.',
    keyPoints: ['Titolario = schema per classificare', 'Fascicolo = un affare, tutti i documenti', 'Corrente, deposito, storico (oltre 40 anni)', 'Scarto solo con autorizzazione'],
    simple: 'Ogni pratica ha la sua cartellina (fascicolo). Le carte vecchie non si buttano: serve il permesso.' },
  { id: 'l_anticorr', topic: 't_anticorr', minutes: 4, sources: ['l190', 'dlgs24', 'anac430', 'dpr62'],
    body: 'La legge anticorruzione è la ==L. 190/2012==. Per le scuole, il responsabile della prevenzione della corruzione e della trasparenza (==RPCT==) è di norma il ==Direttore dell\'Ufficio scolastico regionale==.\n\nIl ==conflitto di interessi==: se una pratica riguarda te o un tuo parente, devi ==astenerti e segnalarlo==.\n\nIl ==whistleblowing== (D.Lgs. 24/2023) tutela chi ==segnala illeciti== conosciuti nel contesto di lavoro: la segnalazione è riservata e sono ==vietate le ritorsioni==.',
    example: 'Ti arriva da istruire la domanda di supplenza di tua cugina: lo dici al DSGA e la pratica passa a un collega.',
    keyPoints: ['Anticorruzione: L. 190/2012', 'RPCT delle scuole: Direttore USR (di norma)', 'Conflitto di interessi = astensione', 'Whistleblowing: D.Lgs. 24/2023, niente ritorsioni'],
    simple: 'Se una pratica riguarda qualcuno a cui tieni, non la tocchi. Chi segnala un illecito è protetto.' },
  { id: 'l_segr', topic: 't_segr', minutes: 5, sources: ['dpr445', 'gdpr'],
    body: 'Una segreteria scolastica è divisa di solito in aree: ==alunni/didattica== (iscrizioni, nulla osta, certificati), ==personale== (contratti, assenze, supplenze), ==contabilità e acquisti==, ==affari generali e protocollo==.\n\nIl ==SIDI== è il sistema informativo del Ministero usato dalle segreterie (ad esempio per gestire graduatorie e contratti). Le comunicazioni interne passano di solito per ==circolari== pubblicate su registro elettronico o sito.\n\nAl telefono e allo sportello ==non dai informazioni personali== senza identificare chi le chiede. Quando una supplente prende servizio, la scuola ==controlla i titoli dichiarati== nella domanda: le autocertificazioni si verificano.',
    example: 'Un uomo chiama dicendo di essere il padre di un alunno e chiede le assenze: non le dai al telefono, lo inviti a usare il registro elettronico o a venire con un documento.',
    keyPoints: ['Aree: alunni, personale, contabilità, protocollo', 'SIDI = sistema del Ministero', 'Circolari per le comunicazioni interne', 'Prima identifichi, poi informi', 'I titoli dichiarati si controllano'],
    simple: 'La segreteria è come un piccolo ufficio comunale: ognuno ha la sua area, e i dati delle persone si danno solo a chi ne ha diritto.' }
];

// Spaced repetition stile SM-2, semplificato e prevedibile.
// grade: 0 = sbagliata, 1 = giusta ma incerta/tirata a indovinare, 2 = giusta e sicura.

function newCard(now = Date.now()) { return { ease: 2.3, interval: 0, due: now, reps: 0, lapses: 0, streak: 0, last: null }; }

function reviewCard(card, grade, now = Date.now()) {
  const c = { ...card };
  if (grade === 0) {
    c.lapses++; c.streak = 0; c.reps++;
    c.ease = Math.max(1.3, c.ease - 0.2);
    c.interval = 1;                                  // si rivede domani
  } else {
    c.reps++; c.streak++;
    if (grade === 1) { c.ease = Math.max(1.3, c.ease - 0.05); c.interval = c.interval < 1 ? 1 : Math.max(1, Math.round(c.interval * 1.2)); }
    else { c.interval = c.interval < 1 ? 1 : c.interval < 3 ? 3 : Math.round(c.interval * c.ease); }
  }
  c.interval = Math.min(c.interval, 120);
  c.last = now;
  c.due = now + c.interval * DAY;
  return c;
}

function isDue(card, now = Date.now()) { return card && card.reps > 0 && card.due <= now; }
function overdueDays(card, now = Date.now()) { return Math.max(0, (now - card.due) / DAY); }

function dueQuestionIds(state, now = Date.now()) {
  return Object.entries(state.cards).filter(([, c]) => isDue(c, now))
    .sort((a, b) => overdueDays(b[1], now) - overdueDays(a[1], now)).map(([id]) => id);
}

// ===== engine/learning.js =====
// Motore didattico: per ogni argomento tiene più dimensioni, non una sola percentuale.



const ERROR_TYPES = {
  sconosciuto: 'Concetto mai visto',
  confusione: 'Confusione tra concetti simili',
  dimenticanza: 'Dimenticato',
  distrattore: 'Caduta nel tranello',
  lettura: 'Letto male / troppa fretta',
  applicazione: 'Sai la regola ma non la applichi',
  velocita: 'Tempo insufficiente',
  falsa_sicurezza: 'Ero sicura, ma era sbagliata'
};

function allQuestions(state) { return [...ALL_QUESTIONS, ...(state.customQuestions || [])]; }
function questionById(state, id) { return allQuestions(state).find(q => q.id === id); }

function defaultTopicStat() {
  return {
    theory: 0,          // 0-1: lezioni lette, spiegazioni comprese
    practice: 0,        // 0-1: domande di applicazione corrette
    acc: null,          // media mobile accuratezza quiz
    n: 0, correct: 0,
    stability: 1,       // giorni: quanto "regge" la memoria (curva dell'oblio)
    lastReview: null,
    errorsOpen: 0,
    levels: { riconoscimento: { n: 0, c: 0 }, applicazione: { n: 0, c: 0 }, spiegazione: { n: 0, s: 0 } },
    guessedRight: 0,    // risposte giuste dichiarate "non sicura"
    notUnderstood: 0
  };
}

function getStat(state, topicId) {
  if (!state.topicStats[topicId]) state.topicStats[topicId] = defaultTopicStat();
  return state.topicStats[topicId];
}

// Memoria stimata: R = e^(-t/S)
function retention(stat, now = Date.now()) {
  if (!stat || !stat.lastReview) return 0;
  const days = Math.max(0, (now - stat.lastReview) / DAY);
  return Math.exp(-days / Math.max(0.5, stat.stability));
}

function mastery(stat, now = Date.now()) {
  if (!stat || (stat.n === 0 && stat.theory === 0)) return 0;
  const acc = stat.acc ?? 0;
  const confidence = clamp(stat.n / 6);            // con poche risposte la stima pesa meno
  const base = 0.45 * acc * confidence + 0.25 * stat.theory + 0.30 * stat.practice;
  return clamp(base * (0.6 + 0.4 * retention(stat, now)));
}

function applyLessonStats(state, lessonId, understood, now) {
  const lesson = LESSONS.find(l => l.id === lessonId);
  const topicId = lesson ? lesson.topic : lessonId.replace(/^l_/, 't_');
  const st = getStat(state, topicId);
  st.theory = clamp(st.theory + (understood ? 0.35 : 0.1));
  if (!understood) st.notUnderstood++;
  if (!st.lastReview) st.lastReview = now;
  return st;
}

function markLessonRead(state, lessonId, understood = true, now = Date.now()) {
  state.lessonsRead[lessonId] = now;
  (state.lessonLog = state.lessonLog || []).push({ id: uid('l'), lessonId, ok: !!understood, at: now });
  return applyLessonStats(state, lessonId, understood, now);
}

function classifyError(state, q, ctx, now = Date.now()) {
  const st = getStat(state, q.topic);
  const prior = state.attempts.filter(a => a.qid === q.id);
  const lesson = lessonForTopic(q.topic);
  if (ctx.dontKnow) return st.theory === 0 && !(lesson && state.lessonsRead[lesson.id]) ? 'sconosciuto' : 'dimenticanza';
  if (ctx.timedOut) return 'velocita';
  if (ctx.ms != null && ctx.ms < 3500) return 'lettura';
  if (ctx.confident) return 'falsa_sicurezza';
  if (prior.some(a => a.correct)) return 'dimenticanza';
  if (q.trap != null && ctx.chosen === q.trap) return 'distrattore';
  if (q.level === 'applicazione' && st.levels.riconoscimento.n >= 2 && st.levels.riconoscimento.c / st.levels.riconoscimento.n >= 0.6) return 'applicazione';
  if (st.theory === 0 && st.n < 2) return 'sconosciuto';
  return 'confusione';
}

// ctx: { chosen, ms, confident, unsure, dontKnow, timedOut, sessionId }
// Parte "pura" di una risposta: aggiorna statistiche e ripasso. Usata dal vivo e per ricostruire i progressi dopo una sincronizzazione.
function applyAttemptStats(state, q, { correct, unsure = false, diagnostic = false, at }) {
  const now = at, ctx = { unsure, diagnostic };
  const st = getStat(state, q.topic);
  st.n++; if (correct) st.correct++;
  const v = correct ? (ctx.unsure ? 0.6 : 1) : 0;
  st.acc = st.acc == null ? v : st.acc * 0.7 + v * 0.3;
  const lv = st.levels[q.level] || st.levels.riconoscimento;
  lv.n++; if (correct) lv.c++;
  if (correct && q.level === 'applicazione') st.practice = clamp(st.practice + 0.15);
  if (correct && q.level === 'riconoscimento') st.theory = clamp(st.theory + 0.04);
  if (correct && ctx.unsure) st.guessedRight++;
  // memoria: risposte giuste dopo un intervallo rafforzano di più
  const gap = st.lastReview ? (now - st.lastReview) / DAY : 0;
  st.stability = correct ? Math.min(180, st.stability * (1.3 + Math.min(1, gap / st.stability) * 0.5)) : Math.max(0.5, st.stability * 0.6);
  st.lastReview = now;

  const grade = correct ? (ctx.unsure ? 1 : 2) : 0;
  // Nel test iniziale una risposta sbagliata è una lacuna da studiare, non un errore da ripassare domani.
  if (!(ctx.diagnostic && !correct)) state.cards[q.id] = reviewCard(state.cards[q.id] || newCard(now), grade, now);
  return st;
}

function recordAttempt(state, q, ctx, now = Date.now()) {
  const correct = !ctx.dontKnow && !ctx.timedOut && ctx.chosen === q.answer;
  const st = applyAttemptStats(state, q, { correct, unsure: !!ctx.unsure, diagnostic: !!ctx.diagnostic, at: now });
  const attempt = { id: uid('a'), qid: q.id, topic: q.topic, level: q.level, correct, chosen: ctx.chosen ?? null, ms: ctx.ms ?? null, unsure: !!ctx.unsure, at: now, session: ctx.sessionId || null };
  if (ctx.diagnostic) attempt.diag = true;
  state.attempts.push(attempt);

  let error = null;
  if (!correct && !ctx.diagnostic) {
    error = { id: uid('e'), qid: q.id, topic: q.topic, type: classifyError(state, q, ctx, now), at: now, resolved: false, userType: null };
    state.errors.push(error);
    st.errorsOpen++;
    attempt.errorId = error.id;
  } else if (correct && state.cards[q.id].streak >= 2) {
    for (const e of state.errors) if (e.qid === q.id && !e.resolved) { e.resolved = true; e.resolvedAt = now; st.errorsOpen = Math.max(0, st.errorsOpen - 1); }
  }
  return { correct, attempt, error };
}

function applyOpenStats(state, q, score, now) {
  const st = getStat(state, q.topic);
  st.levels.spiegazione.n++; st.levels.spiegazione.s += score;
  st.theory = clamp(st.theory + 0.15 * score);
  st.practice = clamp(st.practice + 0.1 * score);
  st.lastReview = now;
  return st;
}

function recordOpenAnswer(state, q, score, sessionId, now = Date.now()) {
  applyOpenStats(state, q, score, now);
  state.attempts.push({ id: uid('a'), qid: q.id, topic: q.topic, level: 'spiegazione', correct: score >= 0.6, score, at: now, session: sessionId || null });
}

// Falsa preparazione: riconosci la risposta ma non sai spiegarla/applicarla, o indovini spesso.
function falsePreparation(stat) {
  if (!stat) return null;
  const r = stat.levels.riconoscimento, a = stat.levels.applicazione, s = stat.levels.spiegazione;
  const rAcc = r.n ? r.c / r.n : null;
  const aAcc = a.n ? a.c / a.n : null;
  const sAvg = s.n ? s.s / s.n : null;
  if (rAcc != null && r.n >= 3 && rAcc >= 0.75) {
    if (aAcc != null && a.n >= 2 && aAcc < 0.5) return 'Riconosci le risposte, ma sbagli quando devi applicarle a un caso pratico.';
    if (sAvg != null && sAvg < 0.5) return 'Riconosci le risposte, ma fatichi a spiegarle con parole tue.';
  }
  if (stat.correct >= 4 && stat.guessedRight / stat.correct > 0.4) return 'Molte risposte giuste erano tirate a indovinare: il punteggio sembra migliore della preparazione reale.';
  return null;
}

function topicSnapshot(state, topicId, now = Date.now()) {
  const st = state.topicStats[topicId] || defaultTopicStat();
  return { mastery: mastery(st, now), retention: retention(st, now), theory: st.theory, practice: st.practice, acc: st.acc, n: st.n, errorsOpen: st.errorsOpen, falsePrep: falsePreparation(st), daysSince: st.lastReview ? Math.floor((now - st.lastReview) / DAY) : null };
}

function overallMastery(state, topicIds = TOPICS.map(t => t.id), now = Date.now()) {
  return avg(topicIds.map(id => mastery(state.topicStats[id], now)));
}
function coverage(state, topicIds = TOPICS.map(t => t.id)) {
  return avg(topicIds.map(id => { const st = state.topicStats[id]; return st && (st.theory >= 0.3 || st.n >= 3) ? 1 : 0; }));
}
function readinessLabel(m) { return m >= 0.75 ? 'pronta' : m >= 0.5 ? 'quasi pronta' : 'non ancora pronta'; }

function recordHistory(state, now = Date.now()) {
  state.history[dayKey(now)] = { mastery: overallMastery(state, undefined, now), coverage: coverage(state) };
}

// Ricostruisce statistiche e ripassi rigiocando lezioni e risposte in ordine di tempo.
// Così, dopo aver unito i dati di due dispositivi, i progressi sono coerenti con tutto ciò che è stato fatto.
function rebuildDerived(state) {
  state.topicStats = {}; state.cards = {};
  const events = [
    ...(state.lessonLog || []).map(e => ({ at: e.at, k: 0, e })),
    ...state.attempts.map(a => ({ at: a.at, k: 1, a }))
  ].sort((x, y) => x.at - y.at || x.k - y.k);
  for (const ev of events) {
    if (ev.e) { applyLessonStats(state, ev.e.lessonId, ev.e.ok, ev.at); continue; }
    const a = ev.a, q = questionById(state, a.qid);
    if (!q) continue;
    if (a.level === 'spiegazione') applyOpenStats(state, q, a.score ?? (a.correct ? 1 : 0), a.at);
    else applyAttemptStats(state, q, { correct: a.correct, unsure: !!a.unsure, diagnostic: !!a.diag, at: a.at });
  }
  for (const e of state.errors) if (!e.resolved) getStat(state, e.topic).errorsOpen++;
  return state;
}

// ===== engine/quiz.js =====
// Motore quiz: selezione domande e correzione offline delle risposte aperte.




function mcQuestions(state) { return allQuestions(state).filter(q => q.type === 'mc'); }

// mode: random | topic | subject | errors | due | adaptive
function pickQuestions(state, { mode = 'adaptive', topicIds = null, subjectId = null, n = 10, exclude = [], rnd = Math.random, now = Date.now() } = {}) {
  let pool = mcQuestions(state).filter(q => !exclude.includes(q.id));
  if (subjectId) { const ids = TOPICS.filter(t => t.subject === subjectId).map(t => t.id); pool = pool.filter(q => ids.includes(q.topic)); }
  if (topicIds) pool = pool.filter(q => topicIds.includes(q.topic));
  if (mode === 'errors') {
    const ids = [...new Set(state.errors.filter(e => !e.resolved).sort((a, b) => b.at - a.at).map(e => e.qid))];
    return ids.map(id => pool.find(q => q.id === id)).filter(Boolean).slice(0, n);
  }
  if (mode === 'due') {
    const ids = dueQuestionIds(state, now);
    return ids.map(id => pool.find(q => q.id === id)).filter(Boolean).slice(0, n);
  }
  if (mode === 'random' || mode === 'subject') return shuffle(pool, rnd).slice(0, n);
  // adaptive / topic: prima mai viste, poi sbagliate, poi le altre; difficoltà vicina al livello
  const seen = new Set(state.attempts.map(a => a.qid));
  const wrongLast = new Set();
  for (const a of state.attempts) { if (a.correct) wrongLast.delete(a.qid); else wrongLast.add(a.qid); }
  const scored = pool.map(q => {
    const m = mastery(getStat(state, q.topic), now);
    const target = 1 + m * 2;                                   // livello 1..3
    let s = 1 - Math.abs(q.difficulty - target) / 3;
    if (!seen.has(q.id)) s += 1; if (wrongLast.has(q.id)) s += 0.8;
    if (q.level === 'applicazione' && m > 0.4) s += 0.3;
    return { q, s: s + rnd() * 0.3 };
  });
  return scored.sort((a, b) => b.s - a.s).slice(0, n).map(x => x.q);
}

// Test diagnostico: una domanda per argomento (facile se esiste), così il primo giorno resta breve.
function diagnosticQuestions(state, rnd = Math.random) {
  const out = [];
  for (const t of TOPICS) {
    const qs = mcQuestions(state).filter(q => q.topic === t.id && q.origin === 'content-pack');
    const pick = shuffle(qs.filter(q => q.difficulty === 1), rnd)[0] || shuffle(qs, rnd)[0];
    if (pick) out.push(pick);
  }
  return out;
}

// Simulazione: distribuzione proporzionale per materia, tempo 1 min/domanda.
function simulationQuestions(state, n = 30, rnd = Math.random, subjectIds = null) {
  const pool = mcQuestions(state).filter(q => !subjectIds || subjectIds.includes(TOPICS.find(t => t.id === q.topic)?.subject));
  return shuffle(pool, rnd).slice(0, Math.min(n, pool.length));
}

// Correzione offline: copertura delle parole chiave. Non è un giudizio definitivo:
// l'utente si autovaluta confrontando con la risposta modello.
function gradeOpenOffline(q, text) {
  const t = normalizeText(text);
  const words = t.split(' ').filter(Boolean).length;
  const matched = [], missing = [];
  for (const k of q.keywords) {
    const alts = k.split('|').map(normalizeText);
    (alts.some(a => t.includes(a)) ? matched : missing).push(k.split('|')[0]);
  }
  let score = q.keywords.length ? matched.length / q.keywords.length : 0;
  if (words < 8) score *= 0.6;                                 // risposte troppo brevi
  return { score: clamp(score), matched, missing, words };
}

// ===== engine/scheduler.js =====
// Motore di pianificazione. Decide cosa fare, quanto, in che ordine. Funziona senza AI.




const REVIEW_COST = 0.75, MC_COST = 1, OPEN_COST = 4;

function availabilityFor(state, date = Date.now()) {
  const a = state.user?.availability || [0, 30, 30, 30, 30, 30, 0];
  return a[new Date(date).getDay()] || 0;
}

function daysToExam(state, now = Date.now()) {
  const dates = [];
  if (state.user?.targetDate) dates.push(new Date(state.user.targetDate).getTime());
  for (const p of state.procedures || []) for (const d of p.deadlines || []) if (d.date && p.active !== false) dates.push(new Date(d.date).getTime());
  const future = dates.filter(d => d >= startOfDay(now)).sort((a, b) => a - b);
  return future.length ? daysBetween(now, future[0]) : null;
}

function goalWeights(state) {
  const g = GOALS.find(x => x.id === (state.user?.goal || 'lavoro')) || GOALS[0];
  return g.weights;
}

// Priorità = importanza × debolezza × errori × memoria × urgenza × prerequisiti × varietà
function topicPriority(state, topic, { now = Date.now(), masteryOf = null, studiedToday = new Set() } = {}) {
  const st = getStat(state, topic.id);
  const m = masteryOf ? masteryOf(topic.id) : mastery(st, now);
  const w = goalWeights(state)[topic.subject] ?? 1;
  const importance = (topic.importance / 3) * w;
  const weakness = 0.15 + 0.85 * (1 - m);
  const errors = 1 + 0.25 * Math.min(st.errorsOpen, 4);
  const memory = st.lastReview ? 0.3 + 0.7 * (1 - retention(st, now)) : 1;
  const dte = daysToExam(state, now);
  const urgency = dte == null ? 1 : 1 + 1.5 / (1 + dte / 21);
  const prereqOk = topic.prereq.every(p => mastery(getStat(state, p), now) >= 0.3 || (masteryOf && masteryOf(p) >= 0.3));
  const prereq = prereqOk ? 1 : 0.3;
  const variety = studiedToday.has(topic.id) ? 0.5 : 1;
  const score = importance * weakness * errors * memory * urgency * prereq * variety;
  return { score, parts: { importance, weakness, errors, memory, urgency, prereq, variety, mastery: m } };
}

function rankTopics(state, opts = {}) {
  return TOPICS.map(t => ({ topic: t, ...topicPriority(state, t, opts) })).sort((a, b) => b.score - a.score);
}

function explainPriority(p) {
  const r = [];
  if (p.parts.importance >= 0.9) r.push('è importante per il tuo obiettivo');
  if (p.parts.mastery < 0.3) r.push('non lo conosci ancora bene');
  if (p.parts.errors > 1) r.push('hai errori aperti');
  if (p.parts.memory > 0.6 && p.parts.mastery > 0) r.push('lo stai dimenticando');
  if (p.parts.urgency > 1.3) r.push('la scadenza si avvicina');
  if (p.parts.prereq < 1) r.push('(prima andrebbe rinforzato un argomento di base)');
  return r.length ? r.join(', ') : 'è il prossimo passo del programma';
}

function startedTopic(state, topicId) {
  const l = lessonForTopic(topicId), st = state.topicStats[topicId];
  return (l && state.lessonsRead[l.id]) || (st && st.n > 0) ? 1 : 0;
}

function studiedTodaySet(state, now) {
  const k = dayKey(now);
  return new Set(state.attempts.filter(a => dayKey(a.at) === k).map(a => a.topic));
}

function recoveryInfo(state, now = Date.now()) {
  if (!state.sessions.length) return null;
  const last = Math.max(...state.sessions.map(s => s.endedAt || s.startedAt));
  let missed = 0;
  for (let d = startOfDay(last) + DAY; d < startOfDay(now); d += DAY) if (availabilityFor(state, d) > 0) missed++;
  if (missed < 2) return null;
  return { missed, minutes: Math.min(availabilityFor(state, now) || 20, 20), capReviews: 12,
    message: `Bentornata. Hai saltato ${missed} giorni di studio: succede. Oggi una sessione corta per riprendere il ritmo; i ripassi arretrati li distribuisco nei prossimi giorni.` };
}

// mode: auto | lazy | test | errors
function buildSession(state, minutes, { mode = 'auto', now = Date.now(), rnd = Math.random } = {}) {
  const plan = { id: uid('s'), mode, minutes, createdAt: now, blocks: [], focusTopic: null, why: [] };
  const used = new Set();
  const take = qs => qs.filter(q => q && !used.has(q.id)).map(q => (used.add(q.id), q.id));

  if (mode === 'lazy') {
    plan.minutes = 5;
    const ids = take([...pickQuestions(state, { mode: 'due', n: 5, now }), ...pickQuestions(state, { mode: 'errors', n: 5, now })]).slice(0, 5);
    const fill = take(pickQuestions(state, { mode: 'adaptive', n: 10, now, rnd }).filter(q => q.difficulty === 1)).slice(0, 5 - ids.length);
    plan.blocks.push({ kind: 'review', qids: [...ids, ...fill] });
    plan.why.push('Solo 5 domande facili. L\'importante è non interrompere la catena.');
    return plan;
  }
  if (mode === 'errors') {
    const ids = take(pickQuestions(state, { mode: 'errors', n: Math.max(5, minutes), now }));
    plan.blocks.push({ kind: 'review', qids: ids });
    plan.why.push(ids.length ? `Rivediamo ${ids.length} domande che avevi sbagliato.` : 'Non hai errori aperti: ottimo.');
    return plan;
  }
  if (mode === 'test') {
    const ids = take(pickQuestions(state, { mode: 'adaptive', n: Math.max(5, Math.floor(minutes / MC_COST)), now, rnd }));
    plan.blocks.push({ kind: 'quiz', topic: null, qids: ids });
    plan.why.push('Test misto, scelto in base al tuo livello.');
    return plan;
  }

  // AUTO ("Fai tu")
  const rec = recoveryInfo(state, now);
  if (rec) { minutes = Math.min(minutes, rec.minutes); plan.minutes = minutes; plan.why.push(rec.message); }
  const reviewShare = minutes <= 10 ? 0.5 : minutes <= 30 ? 0.3 : 0.25;
  let reviewN = Math.floor((minutes * reviewShare) / REVIEW_COST);
  if (rec) reviewN = Math.min(reviewN, rec.capReviews);
  const reviewIds = take([...pickQuestions(state, { mode: 'due', n: reviewN, now }), ...pickQuestions(state, { mode: 'errors', n: reviewN, now })]).slice(0, reviewN);
  let remaining = minutes - reviewIds.length * REVIEW_COST;
  if (reviewIds.length) { plan.blocks.push({ kind: 'review', qids: reviewIds }); plan.why.push(`Ripasso: ${reviewIds.length} domande che rischi di dimenticare o avevi sbagliato.`); }

  const ranked = rankTopics(state, { now, studiedToday: studiedTodaySet(state, now) });
  let focus = ranked[0];
  let lesson = lessonForTopic(focus.topic.id);
  let addLesson = lesson && !state.lessonsRead[lesson.id];
  if (addLesson && remaining < lesson.minutes + 3) {
    const alt = ranked.find(r => { const l = lessonForTopic(r.topic.id); return !l || state.lessonsRead[l.id]; });
    if (alt) { focus = alt; lesson = lessonForTopic(alt.topic.id); addLesson = false; }
  }
  plan.focusTopic = focus.topic.id;
  plan.why.push(`Argomento: ${focus.topic.name}, perché ${explainPriority(focus)}.`);
  if (addLesson) { plan.blocks.push({ kind: 'lesson', lessonId: lesson.id, topic: focus.topic.id }); remaining -= lesson.minutes; }

  const st = getStat(state, focus.topic.id);
  const open = OPEN_QUESTIONS.find(o => o.topic === focus.topic.id && !state.attempts.some(a => a.qid === o.id && a.at > now - 7 * DAY));
  const wantOpen = open && remaining >= 15 && (st.theory >= 0.3 || addLesson);
  if (wantOpen) remaining -= OPEN_COST;

  const quizN = Math.max(3, Math.floor(remaining / MC_COST));
  const main = take(pickQuestions(state, { mode: 'topic', topicIds: [focus.topic.id], n: quizN, now, rnd }));
  if (main.length) plan.blocks.push({ kind: 'quiz', topic: focus.topic.id, qids: main });
  let missing = quizN - main.length;
  const others = ranked.filter(r => r.topic.id !== focus.topic.id)
    .sort((a, b) => (startedTopic(state, b.topic.id) - startedTopic(state, a.topic.id)) || (b.score - a.score));
  for (const r of others) {
    if (missing <= 0 || plan.blocks.filter(b => b.kind === 'quiz').length >= 4) break;
    const extra = take(pickQuestions(state, { mode: 'topic', topicIds: [r.topic.id], n: Math.min(missing, 6), now, rnd }));
    if (!extra.length) continue;
    plan.blocks.push({ kind: 'quiz', topic: r.topic.id, qids: extra });
    plan.why.push(startedTopic(state, r.topic.id) ? `Poi qualche domanda su ${r.topic.name}.` : `Poi un assaggio di ${r.topic.name}, per capire da dove partire.`);
    missing -= extra.length;
  }
  if (wantOpen) plan.blocks.push({ kind: 'open', qid: open.id, topic: focus.topic.id });
  return plan;
}

function planStats(state, plan) {
  let mc = 0, review = 0, lessons = 0, open = 0;
  const reviewTopics = {};
  for (const b of plan.blocks) {
    if (b.kind === 'review') { review += b.qids.length; mc += b.qids.length; for (const id of b.qids) { const q = questionById(state, id); if (q) reviewTopics[q.topic] = (reviewTopics[q.topic] || 0) + 1; } }
    if (b.kind === 'quiz') mc += b.qids.length;
    if (b.kind === 'lesson') lessons++;
    if (b.kind === 'open') open++;
  }
  const topReview = Object.entries(reviewTopics).sort((a, b) => b[1] - a[1])[0];
  return { mc, review, lessons, open, reviewTopic: topReview ? topReview[0] : null };
}

function tomorrowLine(state, now = Date.now()) {
  const t = startOfDay(now) + DAY + 9 * 3600000;
  const mins = availabilityFor(state, t);
  if (!mins) return 'DOMANI: riposo – nessuna attività prevista';
  const plan = buildSession(state, mins, { now: t, rnd: () => 0.5 });
  const s = planStats(state, plan);
  const topic = plan.focusTopic ? topicById(plan.focusTopic).name : 'misto';
  const rev = s.reviewTopic ? topicById(s.reviewTopic).name : 'nessun ripasso in scadenza';
  return `DOMANI: ${plan.minutes} minuti – ${topic} – ripasso: ${rev} – ${s.mc} quiz`;
}

// Calendario proiettato: simula la rotazione degli argomenti nei prossimi giorni.
function projectCalendar(state, days = 14, now = Date.now()) {
  const proj = {};
  for (const t of TOPICS) proj[t.id] = mastery(getStat(state, t.id), now);
  const out = [], recent = [];
  for (let i = 0; i < days; i++) {
    const d = startOfDay(now) + i * DAY + 9 * 3600000;
    const mins = availabilityFor(state, d);
    if (!mins) { out.push({ date: d, minutes: 0, topic: null }); continue; }
    const ranked = rankTopics(state, { now: d, masteryOf: id => proj[id] })
      .map(r => ({ ...r, score: r.score * (recent[0] === r.topic.id ? 0.35 : recent[1] === r.topic.id ? 0.6 : 1) }))
      .sort((a, b) => b.score - a.score);
    const top = ranked[0].topic;
    recent.unshift(top.id);
    out.push({ date: d, minutes: mins, topic: top.id, alsoReview: i > 0 });
    proj[top.id] = clamp(proj[top.id] + 0.12 * Math.min(2, mins / 30));
  }
  return out;
}

function weeklyMinutes(state) { return (state.user?.availability || []).reduce((a, b) => a + b, 0); }

function studiedMinutesOn(state, now = Date.now()) {
  const k = dayKey(now);
  return state.sessions.filter(s => dayKey(s.startedAt) === k).reduce((a, s) => a + (s.report?.minutes || 0), 0);
}

function suggestedMinutesToday(state, now = Date.now()) {
  const rec = recoveryInfo(state, now);
  const base = availabilityFor(state, now) || 15;
  return rec ? rec.minutes : base;
}

// ===== engine/reporting.js =====
// Report automatici. Tutto calcolato localmente, zero AI.




function sessionReport(state, session, before, now = Date.now()) {
  const atts = state.attempts.filter(a => a.session === session.id);
  const mc = atts.filter(a => a.level !== 'spiegazione');
  const correct = mc.filter(a => a.correct).length;
  const errs = state.errors.filter(e => atts.some(a => a.errorId === e.id));
  const topics = [...new Set(atts.map(a => a.topic).concat(session.lessons || []).map(x => x.topic || x))].filter(Boolean);
  const improvements = [], critical = [];
  for (const t of topics) {
    const m = mastery(getStat(state, t), now), b = before?.[t] ?? 0;
    if (m - b >= 0.03) improvements.push(`${topicById(t).name}: da ${Math.round(b * 100)}% a ${Math.round(m * 100)}%`);
    const tAtts = mc.filter(a => a.topic === t);
    if (tAtts.length >= 3 && tAtts.filter(a => a.correct).length / tAtts.length < 0.5) critical.push(`${topicById(t).name}: meno della metà giuste`);
    const fp = falsePreparation(getStat(state, t)); if (fp) critical.push(`${topicById(t).name}: ${fp}`);
  }
  const errorTypes = {};
  for (const e of errs) errorTypes[e.type] = (errorTypes[e.type] || 0) + 1;
  const toReview = [...new Set(errs.map(e => topicById(e.topic).name))];
  const minutes = Math.max(1, Math.round(((session.endedAt || now) - session.startedAt) / 60000));
  return {
    minutes, activities: (session.lessons || []).length + (mc.length ? 1 : 0) + atts.filter(a => a.level === 'spiegazione').length,
    lessons: (session.lessons || []).length, quizTotal: mc.length, quizCorrect: correct, score: mc.length ? Math.round((correct / mc.length) * 100) : null,
    errors: errs.length, errorTypes, improvements, critical, toReview, tomorrow: tomorrowLine(state, now)
  };
}

function periodReport(state, days = 7, now = Date.now()) {
  const from = startOfDay(now) - (days - 1) * DAY;
  const sessions = state.sessions.filter(s => s.startedAt >= from);
  const atts = state.attempts.filter(a => a.at >= from && a.level !== 'spiegazione');
  const errs = state.errors.filter(e => e.at >= from);
  const perDay = [];
  for (let i = 0; i < days; i++) {
    const d = from + i * DAY, k = dayKey(d);
    perDay.push({ date: d, minutes: sessions.filter(s => dayKey(s.startedAt) === k).reduce((a, s) => a + (s.report?.minutes || 0), 0) });
  }
  const bySubject = SUBJECTS.map(s => {
    const ids = TOPICS.filter(t => t.subject === s.id).map(t => t.id);
    const sa = atts.filter(a => ids.includes(a.topic));
    return { id: s.id, name: s.name, quiz: sa.length, accuracy: sa.length ? sa.filter(a => a.correct).length / sa.length : null, mastery: avg(ids.map(id => mastery(state.topicStats[id], now))) };
  });
  const recurring = {};
  for (const e of errs) { const k = e.userType || e.type; recurring[k] = (recurring[k] || 0) + 1; }
  const recurringTopics = {};
  for (const e of errs) recurringTopics[e.topic] = (recurringTopics[e.topic] || 0) + 1;
  const om = overallMastery(state, undefined, now);
  return {
    days, minutes: perDay.reduce((a, d) => a + d.minutes, 0), perDay, sessions: sessions.length,
    quiz: atts.length, accuracy: atts.length ? atts.filter(a => a.correct).length / atts.length : null,
    bySubject, recurringErrors: Object.entries(recurring).sort((a, b) => b[1] - a[1]).map(([k, n]) => ({ label: ERROR_TYPES[k] || k, n })),
    recurringTopics: Object.entries(recurringTopics).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([t, n]) => ({ name: topicById(t)?.name || t, n })),
    coverage: coverage(state), mastery: om, status: readinessLabel(om), forecast: forecast(state, 0.75, now)
  };
}

// Previsione: regressione lineare sulla padronanza giornaliera.
function forecast(state, target = 0.75, now = Date.now()) {
  const pts = Object.entries(state.history).map(([k, v]) => [new Date(k + 'T12:00:00').getTime(), v.mastery]).sort((a, b) => a[0] - b[0]).slice(-30);
  if (pts.length < 4) return { ready: false, text: 'Servono almeno 4 giorni di studio per una previsione affidabile.' };
  const xs = pts.map(p => (p[0] - pts[0][0]) / DAY), ys = pts.map(p => p[1]);
  const mx = avg(xs), my = avg(ys);
  const slope = xs.reduce((a, x, i) => a + (x - mx) * (ys[i] - my), 0) / (xs.reduce((a, x) => a + (x - mx) ** 2, 0) || 1);
  const cur = ys[ys.length - 1];
  if (cur >= target) return { ready: true, slope, text: 'Hai già raggiunto il livello obiettivo. Ora si mantiene con i ripassi.' };
  if (slope <= 0.0005) return { ready: true, slope, text: 'Con il ritmo attuale la preparazione non sta salendo. Basta poco per ripartire: 15 minuti al giorno.' };
  const days = Math.ceil((target - cur) / slope);
  return { ready: true, slope, days, date: now + days * DAY, text: `Con questo ritmo raggiungi il ${Math.round(target * 100)}% verso il ${fmtDate(now + days * DAY)} (circa ${days} giorni). Stima indicativa.` };
}

function procedureReport(state, proc, now = Date.now()) {
  const topicIds = TOPICS.filter(t => proc.subjects.includes(t.subject)).map(t => t.id);
  const general = overallMastery(state, undefined, now);
  const specific = overallMastery(state, topicIds, now);
  const reqs = proc.requirements.map(r => ({ ...r, done: !!(proc.checked || {})[r.id], sourceTitle: r.source ? sourceById(r.source)?.title : null }));
  const missing = reqs.filter(r => !r.done).map(r => r.text);
  const weak = TOPICS.filter(t => topicIds.includes(t.id) && mastery(state.topicStats[t.id], now) < 0.5).map(t => t.name);
  const sims = state.sessions.filter(s => s.mode === 'simulation' && s.procedure === proc.id);
  const best = sims.length ? Math.max(...sims.map(s => s.report?.score || 0)) : null;
  let status;
  if (proc.type === 'titoli') status = missing.length === 0 ? 'pronto' : missing.length === 1 ? 'quasi pronto' : 'non pronto';
  else { const r = reqs.length ? reqs.filter(x => x.done).length / reqs.length : 1; status = specific >= 0.75 && r === 1 ? 'pronto' : specific >= 0.5 && r >= 0.5 ? 'quasi pronto' : 'non pronto'; }
  return { requirements: reqs, deadlines: proc.deadlines, missing, weak, subjects: proc.subjects.map(s => subjectById(s)?.name), general, specific, simulations: sims.length, bestSimulation: best, status };
}

function shareText(state, now = Date.now()) {
  const r = periodReport(state, 7, now);
  const name = state.user?.name || 'Giorgia';
  return `ATA Coach – settimana di ${name}\nStudio: ${fmtMinutes(r.minutes)} in ${r.sessions} sessioni\nQuiz: ${r.quiz}${r.accuracy != null ? ` (${Math.round(r.accuracy * 100)}% giuste)` : ''}\nPreparazione: ${Math.round(r.mastery * 100)}% – ${r.status}\nProgramma coperto: ${Math.round(r.coverage * 100)}%\n${tomorrowLine(state, now)}`;
}
